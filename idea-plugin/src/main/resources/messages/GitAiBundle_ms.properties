# IntelliJ Properties File
plugin.name=Git AI - Penggilap Commit Tak Segerak
plugin.description=<![CDATA[\
<h3>Commit dahulu, fikir kemudian.</h3>\
<br/>\
<p>Jangan tunggu AI menjana mesej commit anda lagi. <b>Git AI</b> disepadukan ke dalam aliran kerja Git biasa anda dan menggunakan LLM (DeepSeek, OpenAI, Ollama) untuk menulis semula mesej commit sebagai Conventional Commits yang kemas \u2014 sepenuhnya secara tak segerak.</p>\
<br/>\
<p>Anda menulis <code>git commit -m "fix bug"</code> dan terus mengekod. Beberapa saat kemudian, ia menjadi <code>fix(auth): resolve session timeout on mobile devices</code> secara senyap di latar belakang.</p>\
<br/>\
<p><b>Ciri-ciri:</b></p>\
<ul>\
    <li><b>Tanpa Gangguan</b> \u2014 Penjejakan syot kilat keadaan IDE serta-merta memastikan kod anda selamat tanpa menyekat terminal atau aliran kerja IDE.</li>\
    <li><b>Push Keutamaan Tertunda</b> \u2014 Push dimasukkan ke dalam baris gilir secara automatik semasa AI bekerja dan dilaksanakan secara senyap selepas penggilapan selesai.</li>\
    <li><b>Widget Bar Status Langsung</b> \u2014 Lihat dengan segera sama ada daemon Git AI sedang menggilap pada bahagian bawah IDE.</li>\
    <li><b>Tetingkap Alat &amp; Log</b> \u2014 Log dan jejak daemon masa nyata terus dalam IntelliJ.</li>\
    <li><b>UI Sejarah Commit</b> \u2014 Tindakan natif untuk membuat asal perubahan, mencuba semula penggilapan atau membatalkan permintaan.</li>\
    <li><b>Tetapan Visual</b> \u2014 Konfigurasikan kunci API dan penyedia (DeepSeek, OpenAI, Ollama setempat) dalam Keutamaan dengan sokongan i18n.</li>\
</ul>\
<br/>\
]]>

