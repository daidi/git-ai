name = "git-ai-update-proxy"
main = "worker.js"
compatibility_date = "2024-04-14"

# Using a dedicated subdomain is safer and skips path limitation errors.
# Cloudflare will auto-create the git-ai.codegg.org DNS record for you.
routes = [
  { pattern = "git-ai.codegg.org", custom_domain = true }
]

[triggers]
crons = ["15 3 * * *"]

# USAGE_ADMIN_TOKEN must be set with `wrangler secret put`, never in this file.

[[d1_databases]]
binding = "USAGE_DB"
database_name = "git-ai-usage"
database_id = "db98720b-638c-4560-8eac-936899a3fe14"
migrations_dir = "migrations"
